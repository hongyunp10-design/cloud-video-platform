
name: Job Service CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy/gitops/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  java-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: cloud_video_platform_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: job-service/pom.xml

      - name: Run complete Java test suite
        working-directory: job-service
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_PASSWORD: ci_test_password
        run: mvn -B -ntp verify

      - name: Prepare release JAR
        working-directory: job-service
        run: |
          test -s target/job-service-0.0.1-SNAPSHOT.jar
          cp target/job-service-0.0.1-SNAPSHOT.jar app.jar

      - name: Upload Java release artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-service-jar
          path: job-service/app.jar
          if-no-files-found: error
          retention-days: 7

  publish-images:
    name: Publish ${{ matrix.name }}
    needs: java-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-service
            context: ./api-service
            dockerfile: ./api-service/Dockerfile

          - name: worker-service
            context: ./worker-service
            dockerfile: ./worker-service/Dockerfile

          - name: job-service
            context: ./job-service
            dockerfile: ./job-service/Dockerfile.release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Java release artifact
        if: matrix.name == 'job-service'
        uses: actions/download-artifact@v4
        with:
          name: job-service-jar
          path: ./job-service

      - name: Verify downloaded JAR
        if: matrix.name == 'job-service'
        run: |
          test -s job-service/app.jar
          sha256sum job-service/app.jar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          file: ${{ matrix.dockerfile }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  update-gitops:
    name: Promote images to GitOps
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - name: Update GitOps image versions
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git fetch origin main

          # Never deploy an older workflow run over newer code.
          CURRENT_SHA="$(git rev-parse origin/main)"
          if [ "$CURRENT_SHA" != "$RELEASE_SHA" ]; then
            echo "Skipping outdated release: $RELEASE_SHA"
            exit 0
          fi

          FILE="deploy/gitops/kustomization.yaml"

          # This project publishes exactly three application images.
          COUNT="$(grep -cE '^[[:space:]]*newTag:' "$FILE")"
          if [ "$COUNT" -ne 3 ]; then
            echo "ERROR: Expected exactly 3 image tags, found $COUNT"
            exit 1
          fi

          sed -i -E \
            "s/^([[:space:]]*newTag:[[:space:]]*).*/\1${RELEASE_SHA}/" \
            "$FILE"

          git diff --check

          if git diff --quiet -- "$FILE"; then
            echo "GitOps already points to $RELEASE_SHA"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$FILE"
          git commit -m "chore(gitops): deploy $RELEASE_SHA"
          git push origin HEAD:main

          echo "Promoted $RELEASE_SHA to GitOps"
