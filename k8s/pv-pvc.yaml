apiVersion: v1
kind: PersistentVolume
metadata:
  name: video-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/cloud-video-platform
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: video-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 5Gi
