apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api-service
          image: api-service:v18
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          #api-service 的 Deployment env（强制）
          #在 k8s/api-deployment.yaml 的 api 容器里加/改：
          env:
            - name: RAY_ADDRESS
              value: "ray://ray-head:10001"
            - name: RAY_NAMESPACE
              value: "video"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          volumeMounts:
          # ✅ 只挂一次，语义明确
            - name: video-storage
              mountPath: /data

      volumes:
        - name: video-storage
          persistentVolumeClaim:
            claimName: video-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: NodePort
  selector:
    app: api-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
