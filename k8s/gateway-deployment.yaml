apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: gateway-service:v5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # ====== 最小路由：/video/** -> api-service:8000/video/**
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_ID
              value: "api-video"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_URI
              value: "http://api-service:8000"
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0
              value: "Path=/video/**"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
